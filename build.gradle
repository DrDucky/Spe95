// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.0'

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.3'  // Google Services plugin
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.9.3'
        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1' apply false
    id("com.android.application") version '8.12.0' apply false
    id("com.google.gms.google-services") version "4.4.3" apply false
    id("org.jetbrains.kotlin.android") version "2.2.0" apply false
    id("com.google.firebase.crashlytics") version "3.0.5" apply false
}

ext {
    recyclerViewVersion = '1.4.0'
    cardViewVersion = '1.0.0'
    koin_version = '3.5.6'
    gson_version = '2.10.1'
    nav_version = "2.9.3"
    lifecycle_version = '2.9.2'
    glide_version = '4.16.0'
    firestore_ui_version = '8.0.2'
    constraint_layout_version = '2.2.1'
    preferences_version = "1.2.1"
    places_version = '4.4.1'
    mpandroidchart_version = '3.1.0'
    material_version = '1.12.0'
    flexbox_version = '3.0.0'
    play_app_update_version = '2.1.0'
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
